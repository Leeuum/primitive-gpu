[package]
name = "primitive-gpu"
version = "0.1.0"
edition = "2021"
description = "Reproduce images with geometric primitives, scoring candidate shapes on the GPU"
license = "MIT"
repository = "https://github.com/Leeuum/primitive-gpu"
readme = "../README.md"

[[bin]]
name = "primitive-gpu"
path = "src/main.rs"

[dependencies]
wgpu = "29"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
image = "0.25"
tiny-skia = "0.11"
rayon = "1"
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "fs", "time", "signal", "io-util"] }
futures-util = "0.3.34"
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
tokio-util = { version = "0.7.20", features = ["io"] }
zip = { version = "2", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
